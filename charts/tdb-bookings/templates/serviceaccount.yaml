{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tdb-bookings.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tdb-bookings.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The service never calls the Kubernetes API, so no token is mounted into its pods.
automountServiceAccountToken: false
{{- end }}
