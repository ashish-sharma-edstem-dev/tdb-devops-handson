# Local cluster for exercising the prod values: 1 control plane + 3 workers, one per "zone", so topology spread,
# the PodDisruptionBudget and `kubectl drain` behave as they would on a 3-AZ EKS cluster.
#   kind create cluster --name tdb --config charts/tdb-bookings/ci/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
