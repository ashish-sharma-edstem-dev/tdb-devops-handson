# CI for tdb-bookings. See docs/adr/0002-ci-pipeline.md for the design.
#
# Pull request : lint, type-check, test, secret/dependency/Dockerfile scans, image build + Trivy scan.
# Push to main : all of the above, then publish the scanned image to GHCR with provenance.
#
# Supply chain: every third-party action is pinned to a full commit SHA (tag in the comment for
# humans and Dependabot); downloaded tools are pinned by version and verified against a
# hard-coded SHA-256. Each pin was the newest release at least 14 days old when chosen
# (supply-chain cooldown); Dependabot keeps a 7-day cooldown for later bumps.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

# PRs: a new push cancels the superseded run. main: one group per commit, so every merged
# commit runs to completion and gets its own image (nothing queued behind another run is dropped).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.12.5" # the uv release uv.lock was produced with (matches the Dockerfile)

jobs:
  lint-test:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install locked dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app tests .claude/hooks/guard.py

      - name: Pytest with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  security:
    name: Secret, dependency and Dockerfile scans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Tools are downloaded from their GitHub releases and checked against these hashes (taken from
      # each release's checksums file). Bump version and hash together.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64.tar.gz
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 # linux-x86_64
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks and hadolint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          curl -sSfL --retry 3 -o "$bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $bin/hadolint" | sha256sum --check --strict
          chmod +x "$bin/hadolint"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Gitleaks (committed secrets, full history)
        run: gitleaks git --redact --no-banner --exit-code 1 .

      - name: Hadolint (Dockerfile)
        run: hadolint Dockerfile

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: security
          cache-dependency-glob: uv.lock

      - name: pip-audit (known CVEs in the locked runtime dependencies)
        # Audits exactly what ships in the image: the locked, hash-pinned runtime set from uv.lock.
        # --disable-pip + --require-hashes: no resolver run, no packages installed.
        # --strict: a dependency that cannot be audited fails the step instead of being skipped.
        run: |
          set -euo pipefail
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx "pip-audit==${PIP_AUDIT_VERSION}" -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off

  image:
    name: Image build, scan, publish
    # Only an image whose code passed every check is built; on main, only that image is published.
    needs: [lint-test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the Trivy SARIF to code scanning
      packages: write # push to GHCR (the push steps only run on main)
      id-token: write # OIDC token for the Sigstore signing certificate of the attestation
      attestations: write # store the build provenance attestation
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SCAN_REF: tdb-bookings:ci-scan # local tag of the loaded image that Trivy scans
      TRIVY_VERSION: "0.76.1"
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 # Linux-64bit.tar.gz
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        # Registry paths must be lowercase; github.repository keeps the owner's case.
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Provenance/SBOM turn the push into an image index; GHCR reads the description from there.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          # sha-<full 40-char commit SHA>: immutable, one per commit. main: moving pointer to the latest.
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
          # Adds revision (commit SHA), source (repo URL), created, version, url, licenses.
          labels: |
            org.opencontainers.image.title=tdb-bookings
            org.opencontainers.image.description=Minimal bookings web service (FastAPI)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load locally for scanning)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SCAN_REF }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # Layer cache in the GitHub Actions cache: unchanged dependency layers are not rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations cannot be loaded into the local image store; the publish build adds them.
          provenance: false
          sbom: false

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
          echo "TRIVY_DB_DAY=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Cache Trivy vulnerability DB (refreshed daily; PR runs only)
        # The DB decides whether the gate passes, so a publishing run always downloads a fresh one
        # instead of trusting a cached copy (no cache-poisoning path into the publish gate). zizmor
        # cannot see this `if:`, hence the inline ignore below.
        if: ${{ env.PUBLISH != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ env.TRIVY_DB_DAY }}
          restore-keys: trivy-db-

      - name: Trivy gate (any CRITICAL fails the job and blocks publishing)
        id: trivy-gate
        # Unfixed CRITICALs count too (--ignore-unfixed is deliberately not set): a critical with no
        # patch is still a critical in production. Exceptions need a reviewed .trivyignore entry.
        run: |
          trivy image --image-src docker --scanners vuln --no-progress \
            --severity CRITICAL --exit-code 1 --format table "$SCAN_REF"

      - name: Trivy report (CRITICAL, HIGH, MEDIUM as SARIF; does not block)
        id: trivy-report
        # Runs even when the gate failed, so the findings that blocked the build show up in code scanning.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          trivy image --image-src docker --scanners vuln --no-progress --skip-db-update \
            --severity CRITICAL,HIGH,MEDIUM --exit-code 0 \
            --format sarif --output "$RUNNER_TEMP/trivy.sarif" "$SCAN_REF"

      - name: Upload Trivy SARIF to code scanning
        # Fork PRs get a read-only token, so security-events: write is not available there.
        if: >-
          ${{ !cancelled() && steps.trivy-report.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-image

      # ---- Publish: push to main only. These steps carry no status function, so they run only if
      # every step above succeeded; a CRITICAL from the Trivy gate stops the job before this point.

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image with SBOM and provenance
        id: push
        if: ${{ env.PUBLISH == 'true' }}
        # Same builder, context, build args and labels as the scanned build, so every layer is a
        # cache hit: the pushed layers are the ones Trivy just scanned. Only the attestations are new.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Attest build provenance (signed, stored in GHCR and the GitHub attestations API)
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records need the extra artifact-metadata: write permission and are not used here.
          create-storage-record: false

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COMMIT: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          BUILD: ${{ steps.build.outcome }}
          REPORT: ${{ steps.trivy-report.outcome }}
          PUSH: ${{ steps.push.outcome }}
          GATE: ${{ steps.trivy-gate.outcome }}
        run: |
          {
            echo "## Container image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${COMMIT}\` |"
            echo "| Build | ${BUILD} |"
            echo "| Trivy CRITICAL gate | ${GATE:-skipped} |"
            echo "| Trivy SARIF report | ${REPORT:-skipped} |"
            if [ "$PUSH" = success ]; then
              echo "| Image | \`${IMAGE}@${DIGEST}\` |"
              printf '| Tags |'
              while read -r tag; do printf " \`%s\`" "$tag"; done <<< "$TAGS"
              echo " |"
              echo
              echo "Trace this image to its commit:"
              echo
              echo '```sh'
              echo "docker buildx imagetools inspect ${IMAGE}:sha-${COMMIT} --format '{{json .Provenance}}'"
              echo "gh attestation verify oci://${IMAGE}@${DIGEST} --owner ${OWNER}"
              echo '```'
            else
              echo "| Published | no (publish step: ${PUSH:-not run}; publishing runs only on push to main, after every check passes) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
